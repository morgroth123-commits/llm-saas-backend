name: Compression and cache header smoke test

on:
  pull_request:
    paths:
      - 'perf/**'
      - '.github/workflows/**'

jobs:
  compression-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install server deps
        run: |
          cd perf/express-server
          npm install
      - name: Start sample server
        run: |
          cd perf/express-server
          nohup npm start > server.log 2>&1 &
          # wait for server to start
          for i in {1..10}; do
            if curl -sS --head "http://127.0.0.1:3000/" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
      - name: Verify compression and Vary headers (gzip, brotli, identity)
        run: |
          sleep 1
          # gzip
          echo "Checking gzip response..."
          curl -sS -H "Accept-Encoding: gzip" -D - http://127.0.0.1:3000/api/hello -o /dev/null | grep -Ei "Content-Encoding: gzip|Vary:|Cache-Control" || (echo "gzip check failed"; exit 1)

          # brotli (br) - Node's compression may not advertise br unless supported; this asserts the server responds without error
          echo "Checking brotli response (may be unsupported by sample server)..."
          curl -sS -H "Accept-Encoding: br" -D - http://127.0.0.1:3000/api/hello -o /dev/null | grep -Ei "Content-Encoding: br|Vary:|Cache-Control" || echo "brotli not present (ok for express sample)"

          # identity (no compression)
          echo "Checking identity (no compression)..."
          curl -sS -H "Accept-Encoding: identity" -D - http://127.0.0.1:3000/api/hello -o /dev/null | grep -Ei "Content-Encoding:|Vary:|Cache-Control" || echo "identity check: headers missing"

      - name: Verify cache headers on static route (fingerprinted)
        run: |
          echo "Checking static asset Cache-Control..."
          curl -sS -D - http://127.0.0.1:3000/static/sample.txt -o /dev/null | grep -Ei "Cache-Control:" || (echo "Cache-Control header missing for static assets"; exit 1)
          echo "Static asset headers are present"
